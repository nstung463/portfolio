<svg width="600" height="700" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#0e1c2b" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="1" opacity="0.55" />
    </pattern>
    <pattern id="hatch-cross" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#0e1c2b" />
      <line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="1" opacity="0.55" />
      <line x1="0" y1="0" x2="7" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.35" />
    </pattern>
  </defs>

  <!-- head, sketched line-art bust — generic silhouette, no facial identity -->
  <circle cx="300" cy="225" r="128" fill="url(#hatch)" stroke="#ffffff" stroke-width="3" opacity="0.95" />

  <!-- shoulders / torso -->
  <path
    d="M 85 700
       C 85 470 180 372 300 372
       C 420 372 515 470 515 700
       Z"
    fill="url(#hatch-cross)"
    stroke="#ffffff"
    stroke-width="3"
    opacity="0.95"
  />

  <!-- a few loose contour strokes for a hand-drawn feel -->
  <path d="M 195 165 C 220 110 270 90 300 90" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" />
  <path d="M 130 470 C 160 420 220 400 260 398" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" stroke-linecap="round" />
  <path d="M 470 470 C 440 420 380 400 340 398" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" stroke-linecap="round" />
</svg>
